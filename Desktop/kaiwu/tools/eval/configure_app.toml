[project_default]
# 下面的是公共配置, 按需修改
run_mode = "eval"
predict_local_or_remote = "remote"
aisrv_connect_to_kaiwu_env_count = 1

use_alloc = false
use_rainbow = false
get_kaiwu_env_by_alloc = false

# 日志轮转设置
rotation = "10MB"
retention = 1
# 是否保存预测数据
save_predict_data = false

# 关闭模型同步
need_to_sync = false

# 预测、利用、加载模型是放在哪里执行的？
# actor容器里的预测进程remote_actor_predict, 大规模场景下的训练, PVP评估, 大规模指环境数目超过64
# aisrv容器里的预测进程remote_aisrv_predict, 中等规模场景下使用, 通信开销转换为进程间队列通信开销, 中等规模指环境数目超过8小于64
# aisrv的工作流所在进程local_aisrv_workflow, 小规模场景下使用, 进程间队列通信开销转换为函数调用, 小规模指环境数目小于8
remote_agent_default_runtime_mode = "remote_actor_predict"

# 设置的actor, learner地址
actor_addrs = {train_one = ["127.0.0.1:8700"], train_two = ["127.0.0.1:8800"]}
learner_addrs = {train_one = ["127.0.0.1:9999"], train_two = ["127.0.0.1:9999"]}
