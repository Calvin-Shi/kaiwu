[feature_config]
; 是否存活（1=活；0=死）
is_hero_alive = one_hot:1:eq
; 位置坐标（min_max 归一到 [0,1]），与地图坐标同量纲
location_x = min_max:-60000:60000
location_z = min_max:-60000:60000
; 生命值比例 hp / max_hp，值域本身就在 [0,1]
hp_rate = min_max:0:1
; 法力/能量比例 ep / max_ep，值域 [0,1]
ep_rate = min_max:0:1
; 英雄等级，1-15 级
level = min_max:1:15
; 经济/金币，按 1v1 常规局上限做归一
money = min_max:0:20000
auto_attack_available = min_max:0:1
; 技能冷却比例：extraction 函数里已经算成 cooldown / cooldown_max，值域 [0,1]
; 1 个 feature_name 会输出 5 个标量（1 普攻 + 3 主动技 + 1 召唤师技能）
skill_cooldown = min_max:0:1
; 相对敌方英雄位置：dx_norm(1) + dz_norm(1) + r_norm(1)，均预归一到 [0,1]
rel_to_opponent = min_max:0:1
; 是否处于敌方防御塔攻击范围内：0=塔外, 1=塔内(距离<=8800)
is_in_enemy_tower_range = min_max:0:1


[feature_functions]
is_hero_alive = is_alive
location_x = get_location_x
location_z = get_location_z
hp_rate = get_hp_rate
ep_rate = get_ep_rate
level = get_level
money = get_money
auto_attack_available:get_auto_attack_available
skill_cooldown = get_skill_cooldown
rel_to_opponent = get_rel_to_opponent
is_in_enemy_tower_range = get_is_in_enemy_tower_range
